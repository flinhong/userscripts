name: Release

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 00:00 UTC — publishes the day's .0 release
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      release_as:
        description: "Explicit version to release, e.g. 1.20261023.0"
        required: false
        type: string

permissions:
  contents: write

# Serialize releases so a push, scheduled run, or manual run can't race each other
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release and push
        run: bun run release:ci
        env:
          RELEASE_AS: ${{ inputs.release_as }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}

      - name: Keep recent SemVer tags (keep last 21)
        run: |
          # Only consider strict SemVer tags, e.g. v1.2.3
          TAGS=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || true)
          TAG_COUNT=$(echo "$TAGS" | grep -c . || true)
          echo "Total SemVer tags: $TAG_COUNT"

          # If more than 21, delete the oldest ones
          if [ "$TAG_COUNT" -gt 21 ]; then
            DELETE_COUNT=$((TAG_COUNT - 21))
            echo "Deleting $DELETE_COUNT old tags"

            echo "$TAGS" | sort -V | head -n "$DELETE_COUNT" | while read -r tag; do
              echo "Deleting remote tag: $tag"
              git push origin ":refs/tags/$tag" || true
              echo "Deleting local tag: $tag"
              git tag -d "$tag" || true
            done
          fi
