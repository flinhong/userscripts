name: Release

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so a push and a scheduled run can't race each other
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release and push
        run: bun run release:ci

      - name: Keep recent tags (keep last 21)
        run: |
          # Count tags
          TAG_COUNT=$(git tag | wc -l)
          echo "Total tags: $TAG_COUNT"

          # If more than 21, delete old ones
          if [ "$TAG_COUNT" -gt 21 ]; then
            DELETE_COUNT=$((TAG_COUNT - 21))
            echo "Deleting $DELETE_COUNT old tags"

            # Get old tags (excluding last 21)
            git tag --sort=-v:refname | tail -n +22 | while read -r tag; do
              echo "Deleting remote tag: $tag"
              git push origin ":refs/tags/$tag" || true
              echo "Deleting local tag: $tag"
              git tag -d "$tag" || true
            done
          fi
